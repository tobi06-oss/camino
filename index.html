<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4E9A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="카미노">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Crect%20width%3D%2224%22%20height%3D%2224%22%20rx%3D%225%22%20fill%3D%22%231F4E9A%22/%3E%3Cpath%20d%3D%22M12%204%20C7%204%204.5%208%204.5%2011.5%20L12%2020%20L19.5%2011.5%20C19.5%208%2017%204%2012%204Z%22%20fill%3D%22%23F2B705%22/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}</style>
<title>카미노 스페인어</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&family=IBM+Plex+Mono:wght@500;600&family=Cormorant+Garamond:ital,wght@1,600;1,700&display=swap">
<style>
/* Layout: 순례자 여권(크레덴시알) — 좁은 세로 단, 위 탭, 단어마다 세요(도장)가 찍히고 산티아고까지 km가 줄어드는 구조 */
:root{
  --paper:#EEF0EA; --card:#FFFFFF; --ink:#1B2A3F; --muted:#5F6A72; --line:#D7DBD2;
  --accent:#1F4E9A; --accent-soft:#DDE6F4; --on-accent:#FFFFFF;
  --arrow:#B07D00; --arrow-soft:#FBEFC8; --stamp:#B4442F;
  --masc:#2F68B8; --fem:#C2415A;
  --good:#23845A; --good-soft:#DDF2E7; --bad:#C2413A; --bad-soft:#F8E0DE;
  --sans:"Jua","Gaegu",system-ui,sans-serif;
  --hand:"Gaegu","Jua",cursive;
  --mono:"IBM Plex Mono",ui-monospace,"Jua",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11171F; --card:#1B2430; --ink:#E8ECEF; --muted:#9CA6AE; --line:#2D3946;
  --accent:#86A9E6; --accent-soft:#24344F; --on-accent:#11171F;
  --arrow:#F2C230; --arrow-soft:#3A3219; --stamp:#EE7D66;
  --masc:#7FA8E8; --fem:#F08AA0;
  --good:#5CC48A; --good-soft:#173A2B; --bad:#F0756A; --bad-soft:#3F2023; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11171F; --card:#1B2430; --ink:#E8ECEF; --muted:#9CA6AE; --line:#2D3946;
  --accent:#86A9E6; --accent-soft:#24344F; --on-accent:#11171F;
  --arrow:#F2C230; --arrow-soft:#3A3219; --stamp:#EE7D66;
  --masc:#7FA8E8; --fem:#F08AA0;
  --good:#5CC48A; --good-soft:#173A2B; --bad:#F0756A; --bad-soft:#3F2023; color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;display:flex;flex-direction:column;gap:14px}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.crest{width:38px;height:38px;border-radius:10px;background:var(--accent);display:grid;place-items:center}
.crest svg{width:24px;height:24px}
.brand h1{margin:0;font-size:24px;font-weight:400}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:-2px}
.iconbtn{height:38px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--muted)}
.tgl{display:inline-flex;align-items:center;gap:7px;color:var(--ink)}
.tgl .sw{position:relative;width:34px;height:20px;border-radius:99px;background:var(--line);transition:background .15s;flex:none}
.tgl .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.tgl[aria-checked="true"] .sw{background:var(--good)}
.tgl[aria-checked="true"] .sw::after{left:16px}
.tgl .st{font-family:var(--mono);font-size:10px;min-width:20px;color:var(--muted)}
.tgl[aria-checked="true"] .st{color:var(--good)}
.tgl{flex:none;white-space:nowrap;padding:0 8px;gap:6px}
.tgl .lb{white-space:nowrap;font-size:13px}
.top{flex-wrap:wrap;row-gap:8px}
.top>div:last-child{flex:none}
@media (max-width:420px){.tgl .st{display:none}.tgl{padding:0 7px}.brand small{display:none}}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.tabs button{padding:9px 4px;border-radius:10px;font-size:15px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.label{font-size:12px;color:var(--muted);letter-spacing:.06em}

/* 순례길 진행 */
.route{display:flex;flex-direction:column;gap:10px}
.route-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.route-name{font-size:22px}
.track{position:relative;height:34px;margin:4px 6px 0}
.track .ln{position:absolute;left:0;right:0;top:12px;height:4px;border-radius:2px;background:var(--line)}
.track .done{position:absolute;left:0;top:12px;height:4px;border-radius:2px;background:var(--arrow);transition:width .6s}
.track .town{position:absolute;top:8px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--card);border:2px solid var(--line)}
.track .town.on{border-color:var(--arrow);background:var(--arrow)}
.track .town span{position:absolute;top:15px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap}
.track .me{position:absolute;top:-6px;margin-left:-9px;width:18px;height:18px;transition:left .6s}
.track .town:first-of-type span{left:0;transform:none}
.track .town.last span{left:auto;right:0;transform:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--paper);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.stat b{font-weight:400;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:14px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chip .num{font-size:11px;opacity:.75;margin-left:3px}
.modes{display:flex;flex-direction:column;gap:8px}
.mode{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;transition:transform .12s,border-color .12s}
.mode:hover{border-color:var(--accent);transform:translateY(-1px)}
.mode:disabled{opacity:.45;cursor:not-allowed;transform:none}
.mode .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:14px;background:var(--accent-soft);color:var(--accent)}
.mode.hero{border:2px solid var(--accent)}
.mode.hero .ic{background:var(--accent);color:var(--on-accent)}
.mode h3{margin:0;font-weight:400;font-size:18px}
.mode p{margin:0;color:var(--muted);font-family:var(--hand);font-size:15px;line-height:1.2}
.mode .side{font-size:13px;color:var(--muted);text-align:right}
.tag{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--arrow-soft);color:var(--arrow)}

/* 성별 */
.art{font-size:.8em;margin-right:.2em}
.art.m{color:var(--masc)}
.art.f{color:var(--fem)}
.gnote{font-size:12px;padding:1px 7px;border-radius:99px;border:1px solid currentColor}
.gnote.m{color:var(--masc)}
.gnote.f{color:var(--fem)}

/* quiz */
.qhead{display:flex;align-items:center;gap:10px}
.qhead .bar{flex:1}
.bar{height:10px;background:var(--accent-soft);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s}
.quit{flex:none;display:inline-flex;align-items:center;gap:4px;font-size:14px;color:var(--ink);padding:7px 12px 7px 9px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);white-space:nowrap}
.quit svg{width:16px;height:16px}
.quit:hover{border-color:var(--bad);color:var(--bad)}
.combo{min-width:66px;text-align:center;font-size:14px;padding:4px 8px;border-radius:99px;background:var(--arrow-soft);color:var(--arrow);transition:transform .15s}
.combo.pop{transform:scale(1.25)}
.prompt{text-align:center;padding:26px 16px 22px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.prompt .ask{color:var(--muted);font-size:15px}
.prompt .big{font-size:38px;line-height:1.15;text-wrap:balance}
.prompt .big.es{font-size:40px}
.prompt .meta{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;align-items:center}
.prompt .think{font-family:var(--hand);font-size:18px;color:var(--muted);margin-top:6px}
.say{font-size:13px;padding:4px 12px;border-radius:99px;border:1px solid var(--accent);color:var(--accent);background:var(--card)}
.lvdots{display:inline-flex;gap:3px;align-items:center}
.lvdots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.lvdots i.on{background:var(--accent)}
.again{position:absolute;top:10px;right:12px;font-size:12px;color:var(--stamp);border:1px dashed var(--stamp);border-radius:8px;padding:1px 6px;transform:rotate(4deg)}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.jb{border-radius:16px;padding:18px 10px;font-size:22px;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid var(--line);background:var(--card);transition:transform .1s}
.jb:active{transform:scale(.97)}
.jb small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.jb.no{color:var(--bad);border-color:var(--bad)}
.jb.yes{background:var(--good);border-color:var(--good);color:var(--card)}
.row{display:flex;gap:8px}
.row>*{flex:1}
.btn{padding:13px 12px;border-radius:14px;font-size:17px;background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:var(--card);color:var(--bad);border:1px solid var(--bad)}
.btn small{font-family:var(--mono);font-size:11px;opacity:.7}

/* 답지 */
.sheet{border-radius:18px;border:1px solid var(--line);background:var(--card);overflow:hidden;animation:rise .25s ease-out}
@keyframes rise{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.sheet-top{padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.sheet-top .who{font-size:15px;color:var(--muted)}
.sheet-top .ans{font-size:32px;color:var(--accent);line-height:1.1}
.sheet-top .pr{font-size:15px;color:var(--muted)}
.verdict{margin-left:auto;font-size:13px;padding:4px 10px;border-radius:99px;white-space:nowrap}
.verdict.good{background:var(--good-soft);color:var(--good)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.sheet-body{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px}
.sec b{display:block;font-weight:400;font-size:12px;color:var(--muted);letter-spacing:.06em;margin-bottom:2px}
.sec p{margin:0;font-size:16px;line-height:1.5}
.sec.memo{background:var(--arrow-soft);border-radius:12px;padding:10px 12px}
.sec.memo b{color:var(--arrow)}
.sec.memo p{font-family:var(--hand);font-size:20px;line-height:1.3;color:var(--ink)}
.memo-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px}
.memo-h b{margin:0!important}
.memo-btn{font-size:13px;padding:3px 10px;border-radius:99px;border:1px solid var(--arrow);color:var(--arrow);background:var(--card)}
.memo-btn.solid{background:var(--arrow);color:var(--card)}
.memo-ta{width:100%;box-sizing:border-box;font-family:var(--hand);font-size:19px;line-height:1.3;color:var(--ink);background:var(--card);
  border:2px solid var(--arrow);border-radius:10px;padding:8px 10px;resize:vertical;min-height:72px}
.memo-ta:focus-visible{outline:none;border-color:var(--accent)}
.memo-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.memo-hint{font-size:11px;color:var(--muted);margin-left:auto}
.newstamp{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--stamp)}

/* result */
.result{display:flex;flex-direction:column;gap:12px;text-align:center}
.result .score{font-size:56px;line-height:1;color:var(--accent)}
.misslist{display:flex;flex-direction:column;gap:6px;text-align:left}
.miss{background:var(--paper);border-radius:12px;padding:8px 12px}
.miss .t{font-family:var(--hand);font-size:16px;color:var(--muted);line-height:1.2}

/* 크레덴시알 */
.pp-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.slot{aspect-ratio:1;max-width:100%;border-radius:14px;border:1px dashed var(--line);background:var(--card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px;text-align:center}
.slot .n{font-size:14px;line-height:1.1}
.slot .k{font-size:11px;color:var(--muted);line-height:1.1}
.slot .lvdots i{width:6px;height:6px}
.sello{width:84px;height:84px;border-radius:50%;border:3px double var(--stamp);color:var(--stamp);display:flex;flex-direction:column;
  align-items:center;justify-content:center;line-height:1.05;text-align:center;font-size:12px;opacity:.92;padding:4px;box-sizing:border-box}
.sello svg{width:20px;height:20px}
.sello .sc{font-size:14px;word-break:keep-all}
.sello .sd{font-family:var(--mono);font-size:8px;letter-spacing:.08em;border-top:1px solid currentColor;margin-top:2px;padding-top:1px}
.sello.in{animation:stampin .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes stampin{0%{transform:scale(2.2) rotate(-25deg);opacity:0}100%{opacity:.92}}
.cont-h{margin:6px 0 0;font-weight:400;font-size:16px;color:var(--muted)}

/* 카드 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.fc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:92px;text-align:left;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.fc.open{grid-column:1/-1;cursor:pointer}
.fc .n{font-size:17px}
.fc .c{font-size:22px;color:var(--accent)}
.fc .c.hide{color:var(--muted);font-size:14px}
.fc .t{font-size:14px;color:var(--muted);line-height:1.45}
.fc .sec.memo{cursor:auto}
.fc .sec.memo p{font-size:18px}
.fc .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.listenbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 26px;border-radius:20px;background:var(--accent);color:var(--on-accent);font-size:15px;margin:6px 0}
.listenbtn svg{width:46px;height:46px}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pcard{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.pcard.on{border:2px solid var(--accent);background:var(--accent-soft)}
.pcard .pes{font-size:22px;color:var(--accent);word-break:break-word}
.pcard .pko{font-size:15px}
.pcard .pr{font-size:13px;color:var(--muted)}
.aud{display:flex;flex-wrap:nowrap;gap:6px;align-items:center;margin-top:6px}
.aud .say{white-space:nowrap;flex:none}
.say.native{text-decoration:none;display:inline-block;border-color:var(--arrow);color:var(--arrow)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));max-width:min(480px,calc(100% - 32px));background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:12px;font-size:14px;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#voiceSel{font-family:inherit;font-size:13px;padding:3px 6px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
.ctab{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ctab th,.ctab td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.ctab th{font-weight:400;color:var(--muted);font-size:13px;white-space:nowrap;width:1%}
.ctab td{font-size:18px}
.ctab td.irr{color:var(--bad)}
.ctab td.sp{width:1%;text-align:right}
.ctab tr.hi{background:var(--accent-soft)}
.ctab tr.hi th{color:var(--accent)}
.ctab.end td{font-size:16px;font-family:var(--mono)}
.ctab thead th{color:var(--ink);font-size:14px}
.tabwrap{overflow-x:auto}
.say.mini{font-size:12px;padding:2px 9px}
.irrkey{color:var(--bad);margin-left:6px}
.okkey{color:var(--good);margin-left:6px}
.vchips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.vchip{padding:5px 12px;border-radius:99px;background:var(--paper);font-size:15px}
.vchip.strong{background:var(--accent);color:var(--on-accent);font-size:18px}
.vchip small{font-size:13px;opacity:.85}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.vcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;text-align:left}
.vcard .es{font-size:18px;color:var(--accent)}
.vcard .ko{font-size:12px;color:var(--muted);line-height:1.2}
.tabs button{font-size:14px}
.gate{display:flex;flex-direction:column;gap:6px;margin-top:10px;padding:12px;border-radius:14px;background:var(--paper)}
.gate .btn small{display:block;font-size:12px;opacity:.85}
.rmwrap summary{cursor:pointer;color:var(--accent);font-size:14px;margin-top:10px}
.rm{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.rm-n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--muted);font-size:14px}
.rm.done .rm-n{background:var(--good);color:var(--card)}
.rm.cur .rm-n{background:var(--accent);color:var(--on-accent)}
.rm.lock{opacity:.6}
.rm-t{font-size:15px}
.rm-g{font-size:14px;color:var(--accent)}
.rm-d{font-size:13px;color:var(--muted);line-height:1.5}
.rm-p{font-size:13px;margin-top:2px}
.citys{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.citystamp{width:74px;height:74px;border-radius:50%;border:3px double var(--stamp);color:var(--stamp);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;text-align:center;font-size:12px;transform:rotate(-8deg)}
.citystamp:nth-child(even){transform:rotate(7deg)}
.citystamp svg{width:18px;height:18px}
.citystamp .cn{font-size:13px}
.citystamp .sd{font-family:var(--mono);font-size:8px;border-top:1px solid currentColor;margin-top:2px;padding-top:1px}
.citystamp.off{border-color:var(--line);color:var(--muted);opacity:.7;border-style:dashed}
.citystamp.in{animation:stampin .45s cubic-bezier(.2,1.6,.4,1)}

/* ---------- 문제 고르기 ----------
   rec: 스페인어 → 뜻 떠올리기 (처음 배울 때)
   pro: 한국어 → 스페인어 떠올리기 (익숙해지면) */
function dir(k){const l=lv(k);if(l<=1)return 'rec';if(l===2)return Math.random()<.5?'rec':'pro';return Math.random()<.8?'pro':'rec'}
function buildSmart(){
  const pool=W.filter(live);
  const due=pool.filter(isDue).sort((a,b)=>dueOf(a).localeCompare(dueOf(b))||lv(a.k)-lv(b.k));
  const fresh=pool.filter(x=>lv(x.k)===0);
  const learning=pool.filter(x=>lv(x.k)>=1&&lv(x.k)<5&&!isDue(x)).sort((a,b)=>(lv(a.k)-lv(b.k))+(Math.random()-.5)*1.6-((S.wr[a.k]||0)-(S.wr[b.k]||0))*.3);
  const done=shuffle(pool.filter(x=>lv(x.k)>=5&&!isDue(x)));
  const ROUND=N(),newCap=Math.ceil(ROUND/3);
  const nNew=Math.min(newCap,fresh.length);
  let out=due.slice(0,ROUND-nNew);
  out.push(...fresh.slice(0,Math.min(nNew,ROUND-out.length)));
  out.push(...learning.slice(0,Math.max(0,ROUND-out.length)));
  out.push(...fresh.slice(nNew,nNew+Math.max(0,ROUND-out.length)));
  out.push(...done.slice(0,Math.max(0,ROUND-out.length)));
  if(out.length<ROUND)out.push(...shuffle(pool.filter(x=>!out.includes(x))).slice(0,ROUND-out.length));
  return shuffle(out).map(x=>({k:x.k,d:dir(x.k)}))}
const noneLeft=()=>!W.some(live);
function buildSpeak(){const pool=W.filter(live).filter(x=>lv(x.k)>=1);const src=pool.length>=5?pool:W.filter(live);
  return shuffle(src.slice()).slice(0,N()).map(x=>({k:x.k,d:'pro'}))}
function buildWrong(){return W.filter(x=>(S.wr[x.k]||0)>0&&!isSure(x)).sort((a,b)=>S.wr[b.k]-S.wr[a.k]).slice(0,N()).map(x=>({k:x.k,d:'pro'}))}

function buildPairs(){const n=Math.min(N(),PAIRS.length);const pw=S.pw||{};
  return PAIRS.map((p,i)=>({i,w:(pw[i]||0)+Math.random()*1.5})).sort((a,b)=>b.w-a.w).slice(0,n).sort(()=>Math.random()-.5).map(o=>({pair:o.i,side:Math.random()<.5?'a':'b'}))}

/* ---------- 간격 반복 ---------- */
const IV={0:1,1:1,2:3,3:7,4:14,5:30};
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return day(d)};
const dueOf=x=>(S.due&&S.due[x.k])||'';
const isDue=x=>lv(x.k)>=1&&dueOf(x)<=day();
function schedule(x){S.due=S.due||{};S.due[x.k]=addDays(IV[lv(x.k)]||1)}
function buildReview(){return W.filter(live).filter(isDue).sort((a,b)=>dueOf(a).localeCompare(dueOf(b))||lv(a.k)-lv(b.k)).slice(0,N()).map(x=>({k:x.k,d:dir(x.k)}))}
function buildListen(){const heard=W.filter(live).filter(x=>lv(x.k)>=1);const src=heard.length>=5?heard:W.filter(live);
  return shuffle(src.slice()).slice(0,N()).map(x=>({k:x.k,d:'listen'}))}

function commit(ok,sure){
  if(R.phase!=='reveal')return;R.phase='done';
  const it=cur();touchDay();markPlayed();R.asked++;
  if(it.pair!=null){
    if(ok){R.combo++;R.best=Math.max(R.best,R.combo);R.right++;S.todayN++;const gain=Math.round(10*mult(R.combo));R.score+=gain;S.xp+=gain;sfx.ok(R.combo)}
    else{R.combo=0;sfx.no();S.pw=S.pw||{};S.pw[it.pair]=(S.pw[it.pair]||0)+1;const id='p'+it.pair;if(!R.miss.includes(id))R.miss.push(id);
      if(!R.requeued.has(id)){R.requeued.add(id);R.q.push({pair:it.pair,side:it.side==='a'?'b':'a',again:true})}}
    save();advance();return}
  const x=BY[it.k];
  let gotStamp=false;
  if(ok&&sure){R.combo++;R.best=Math.max(R.best,R.combo);R.right++;S.todayN++;
    const gain=Math.round(10*mult(R.combo));R.score+=gain;S.xp+=gain;sfx.ok(R.combo);
    R.sureList.push(x.k);R.q=R.q.filter((q,j)=>j<=R.i||q.k!==x.k);
    if(setSure(x,true)){gotStamp=true;R.newStamps.push(x.k)}}
  else if(ok){R.combo++;R.best=Math.max(R.best,R.combo);R.right++;S.todayN++;
    const gain=Math.round(10*mult(R.combo));R.score+=gain;S.xp+=gain;sfx.ok(R.combo);
    if(!R.ups.has(x.k)&&!it.again){const before=lv(x.k),nl=Math.min(5,before+1);
      // 도장(5단계)은 한국어 → 스페인어로 떠올려서 맞혀야만
      if(nl===5&&it.d!=='pro'){}else if(nl>before){S.lv[x.k]=nl;R.ups.add(x.k);if(nl===5){gotStamp=true;S.stampAt[x.k]=day();R.newStamps.push(x.k)}}}
    schedule(x)}
  else{R.combo=0;sfx.no();S.wr[x.k]=(S.wr[x.k]||0)+1;S.lv[x.k]=Math.max(0,lv(x.k)-2);
    if(!R.miss.includes(x.k))R.miss.push(x.k);
    if(!R.requeued.has(x.k)){R.requeued.add(x.k);R.q.push({k:x.k,d:it.d,again:true})}
    S.due=S.due||{};S.due[x.k]=addDays(1)}
  save();
  if(gotStamp){sfx.stamp();
    $('#view').innerHTML=`<section style="display:flex;flex-direction:column;gap:12px">${head()}
      <div class="panel newstamp" style="padding:28px 16px">${selloHTML(x,true)}<div style="font-size:20px">${esc(x.es)} 세요(도장) 획득!</div>
      <div style="font-size:14px;color:var(--muted)">산티아고까지 ${KM-kmNow()}km 남았어요</div></div>
      <button class="btn" id="nextBtn">다음 <small>Enter</small></button></section>`;
    R.phase='stamp';$('#quitBtn').onclick=quit;$('#nextBtn').onclick=advance;$('#nextBtn').focus({preventScroll:true});return}
  advance()}

  out.pres=vover(VEND.pres[t].map((e,i)=>(sc&&[0,1,2,5].includes(i)?vchg(st,sc):st)+e),o.pres);
  out.pret=vover(VEND.pret[t].map((e,i)=>{let s=st;if(t==='ir'&&weak&&(i===2||i===5))s=vchg(st,weak);if(t==='ar'&&i===0&&!plain)s=vsp(s);return s+e}),o.pret);

      if(t==='ar'&&!plain)s=vsp(s);return s+e})}

let TT=null;
const uniq=a=>[...new Set(a)];
function pickDistract(correct,pool,n){const out=[];for(const c of shuffle(pool.slice())){if(c&&c!==correct&&!out.includes(c))out.push(c);if(out.length>=n)break}return out}
function wordQ(x,type){
  const same=W.filter(y=>y.k!==x.k&&y.ct===x.ct&&y.kind===x.kind),stage=W.filter(y=>y.k!==x.k&&y.st===x.st&&y.kind===x.kind),any=W.filter(y=>y.k!==x.k&&y.st<=x.st);
  const pick=(f,corr)=>{let d=pickDistract(corr,same.filter(y=>!x.g||y.g===x.g||type!=='ko2es').map(f),3);
    if(d.length<3)d=d.concat(pickDistract(corr,stage.map(f).filter(v=>!d.includes(v)),3-d.length));
    if(d.length<3)d=d.concat(pickDistract(corr,any.map(f).filter(v=>!d.includes(v)),3-d.length));return d};
  if(type==='ko2es'){const f=y=>(y.g?art(y)+' ':'')+y.es,c=f(x);return {type,x,prompt:x.ko,ask:'스페인어로 알맞은 것은?',ans:c,opts:shuffle([c,...pick(f,c)])}}
  const f=y=>y.ko,c=x.ko;return {type,x,prompt:(x.g?art(x)+' ':'')+x.es,ask:type==='listen'?'잘 듣고 뜻을 고르세요':'이 말의 뜻은?',ans:c,opts:shuffle([c,...pick(f,c)])}}
function verbQ(k){const [inf,t]=k.split('|'),c=CONJ[inf],v=VBY[inf];
  const unlockedT=TNS.filter(T=>comboStage(inf,T.id)<=Math.max(stageNow(),TST[t]||1)).map(T=>T.id);
  if(Math.random()<.35){ // 형태 → 시제·인칭
    const cells=[];unlockedT.forEach(T=>c[T].forEach((f,i)=>cells.push({T,i,f})));
    const cand=cells.filter(z=>z.T===t&&cells.filter(w=>w.f===z.f).length===1);
    if(cand.length){const z=cand[Math.random()*cand.length|0],lab=w=>`${TBY[w.T].n} · ${PERS[w.i][0]}`;
      const others=shuffle(cells.filter(w=>w.f!==z.f&&cells.filter(q=>q.f===w.f).length===1)).map(lab);
      const d=pickDistract(lab(z),uniq(others),3);
      return {type:'vrev',k,prompt:z.f,sub:`${v.inf} (${v.ko})`,ask:'어떤 시제·인칭일까?',ans:lab(z),opts:shuffle([lab(z),...d])}}}
  const p=pickPerson(inf,t),ans=c[t][p];
  let pool=c[t].filter(f=>f!==ans);unlockedT.forEach(T=>{if(T!==t)pool.push(c[T][p])});pool=uniq(pool);
  let d=pickDistract(ans,pool,3);if(d.length<3)d=d.concat(pickDistract(ans,PLAIN[inf][t].filter(f=>f!==ans&&!d.includes(f)),3-d.length));
  return {type:'vform',k,prompt:v.inf,sub:`${TBY[t].n} · ${PERS[p][0]} (${PERS[p][1]})`,ask:'알맞은 형태는?',ans,opts:shuffle([ans,...d])}}
function buildTest(n){const {items,combos}=stageParts(n);const voice=canSpeak&&(!voicesReady||esVoice);
  const nv=combos.length?Math.min(combos.length,Math.round(TEST_N*.35)):0,nw=TEST_N-nv;
  const ws=shuffle(items.slice()).slice(0,nw);
  const q=ws.map((x,i)=>wordQ(x,voice&&i%5===4?'listen':(i%2?'ko2es':'es2ko')));
  shuffle(combos.slice()).slice(0,nv).forEach(k=>q.push(verbQ(k)));
  return shuffle(q).filter(o=>o.opts.length>=2)}
function startTest(){const n=S.stage||1;if(n>5)return;TT={n,q:buildTest(n),i:0,right:0,wrong:[],done:false};

function tAsk(){const it=TT.q[TT.i];TT.done=false;
  const big=it.type==='listen'?`<button class="listenbtn" data-sayt="${esc(it.x.es)}" aria-label="다시 듣기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg><span>다시 듣기</span></button>`
    :`<div class="big${it.type==='ko2es'?'':' es'}">${esc(it.prompt)}</div>${it.sub?`<div class="vchips"><span class="vchip strong">${esc(it.sub)}</span></div>`:''}`;
  $('#view').innerHTML=`<section style="display:flex;flex-direction:column;gap:12px">
    <div class="qhead"><button class="quit" id="quitBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>시험 그만</button>

function tPick(i){if(!TT||TT.done)return;TT.done=true;const it=TT.q[TT.i],ok=it.opts[i]===it.ans;

/* 기록 */
function XS(){S.xb=S.xb||{lv:{},due:{}};S.xb.lv=S.xb.lv||{};S.xb.due=S.xb.due||{};return S.xb}
const xlv=id=>XS().lv[id]||0;
const xDue=id=>xlv(id)>=1&&(XS().due[id]||'')<=day();
function xMark(id,ok){const x=XS();if(ok)x.lv[id]=Math.min(5,xlv(id)+1);else x.lv[id]=Math.max(0,xlv(id)-2);x.due[id]=ok?addDays(IV[xlv(id)]||1):day()}
function xOrder(list){const due=list.filter(o=>xDue(o.id)),fresh=list.filter(o=>xlv(o.id)===0),rest=list.filter(o=>xlv(o.id)>=1&&!xDue(o.id));
  return [...shuffle(due),...shuffle(fresh),...shuffle(rest).sort((a,b)=>xlv(a.id)-xlv(b.id))]}

/* 공통 라운드 */
let X=null;
const backSvg='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function xHead(){return `<div class="qhead"><button class="quit" id="quitBtn">${backSvg}그만하기</button>
  <div class="bar"><i style="width:${X.i/X.q.length*100}%"></i></div><span class="num" style="font-size:14px;color:var(--muted)">${X.i+1}/${X.q.length}</span>
  <span class="combo num">${X.combo>=2?X.combo+'콤보':'×'+mult(X.combo)}</span></div>`}
function startX(kind){const n=Math.min(N(),kind==='build'?15:20);
  const pool=kind==='build'?SENTS.filter(s=>s.st<=stageNow()):CLOZE.filter(c=>c.st<=stageNow());
  const q=xOrder(pool).slice(0,n);if(!q.length)return;
  X={kind,q,i:0,score:0,combo:0,best:0,right:0,asked:0,miss:[],requeued:new Set()};
  $('#tabs').hidden=true;try{history.pushState({camino:'x'},'')}catch(e){}xAsk()}
function xAsk(){X.done=false;if(X.kind==='build')bAsk();else cAsk()}
function xResult(ok,item,again){X.asked++;touchDay();markPlayed();
  if(ok){X.combo++;X.best=Math.max(X.best,X.combo);X.right++;S.todayN++;const g=Math.round(10*mult(X.combo));X.score+=g;S.xp+=g;sfx.ok(X.combo)}
  else{X.combo=0;sfx.no();if(!X.miss.includes(item))X.miss.push(item);if(!X.requeued.has(item.id)){X.requeued.add(item.id);X.q.push(item)}}
  if(!again)xMark(item.id,ok);else if(!ok)xMark(item.id,false);save()}
function xNext(){X.i++;if(X.i>=X.q.length)xFinish();else{xAsk();window.scrollTo(0,0)}}
function quitX(){try{speechSynthesis.cancel()}catch(e){}if(X&&X.asked)xFinish();else{X=null;setTab('home')}}
function xFinish(){const acc=X.asked?Math.round(X.right/X.asked*100):0,nm=X.kind==='build'?'문장 조립':'예문 빈칸';
  $('#view').innerHTML=`<section class="panel result"><div class="label">${nm} 결과</div><div class="score num">${X.score}</div><div style="color:var(--muted)">점</div>
    <div class="stats"><div class="stat"><b class="num">${acc}%</b><span>정답률</span></div><div class="stat"><b class="num">${X.best}</b><span>최고 콤보</span></div><div class="stat"><b class="num">${X.asked}</b><span>푼 문제</span></div></div>
    ${X.miss.length?`<div class="misslist"><div class="label">다시 볼 문장</div>${X.miss.map(o=>`<div class="miss">${esc(o.kind==='build'||o.es&&!o.ans?o.es:o.es.replace('___',o.ans))}<div class="t">${esc(o.ko)}</div></div>`).join('')}</div>`:`<div class="empty" style="padding:6px">전부 맞혔어요. ¡Excelente!</div>`}
    <div class="row"><button class="btn ghost" id="homeBtn">홈으로</button><button class="btn" id="againBtn">한 판 더</button></div></section>`;
  const k=X.kind;X=null;setTimeout(()=>{try{pcFlush()}catch(e){}},400);$('#homeBtn').onclick=()=>setTab('home');$('#againBtn').onclick=()=>startX(k)}

/* 문장 조립 */
function bAsk(){const it=X.q[X.i],toks=sentTokens(it.es);X.bank=shuffle(toks.map((w,i)=>({w,i})));
  if(X.bank.map(t=>t.w).join(' ')===toks.join(' ')&&toks.length>1)X.bank.reverse();X.ans=[];
  $('#view').innerHTML=`<section style="display:flex;flex-direction:column;gap:12px">${xHead()}
    <div class="panel prompt">${X.requeued.has(it.id)&&X.q.indexOf(it)!==X.i?'':''}<div class="ask">단어를 순서대로 눌러 스페인어 문장을 만드세요</div><div class="big" style="font-size:26px">${esc(it.ko)}</div></div>
    <div class="ansline" id="ansLine"></div>
    <div class="bank" id="bank"></div>
    <div class="row"><button class="btn ghost" id="bReset">다시 놓기</button><button class="btn" id="bCheck" disabled>확인 <small>Enter</small></button></div>
    <div id="bfb"></div></section>`;
  $('#quitBtn').onclick=quitX;$('#bReset').onclick=()=>{X.ans=[];bDraw()};$('#bCheck').onclick=bCheck;bDraw()}
function bDraw(){const used=new Set(X.ans);
  $('#ansLine').innerHTML=X.ans.length?X.ans.map(i=>`<button class="tile on" data-a="${i}">${esc(X.bank[i].w)}</button>`).join(''):'<span class="ph">여기에 문장이 만들어져요</span>';
  $('#bank').innerHTML=X.bank.map((t,i)=>`<button class="tile${used.has(i)?' used':''}" data-b="${i}" ${used.has(i)?'disabled':''}>${esc(t.w)}</button>`).join('');
  document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{if(X.done)return;X.ans.push(+b.dataset.b);bDraw()});
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{if(X.done)return;X.ans=X.ans.filter(i=>i!==+b.dataset.a);bDraw()});
  $('#bCheck').disabled=X.ans.length!==X.bank.length||X.done}
function bCheck(){if(X.done||X.ans.length!==X.bank.length)return;X.done=true;const it=X.q[X.i];
  const mine=X.ans.map(i=>X.bank[i].w).join(' '),right=sentTokens(it.es).join(' '),ok=mine===right,again=X.q.indexOf(it)!==X.i;
  $('#bCheck').disabled=true;$('#bReset').disabled=true;document.querySelectorAll('.tile').forEach(t=>t.disabled=true);
  $('#ansLine').classList.add(ok?'ok':'no');
  $('#bfb').innerHTML=`<div class="sheet" style="margin-top:4px"><div class="sheet-top"><div style="min-width:0;flex:1"><div class="who">${ok?'정답이에요':'정답 문장'}</div><div class="ans" style="font-size:24px">${esc(it.es)}</div><div class="aud">${sayT(it.es)}${nativeBtn(it.es)}</div></div>
    <span class="verdict ${ok?'good':'bad'}">${ok?'맞음':'다름'}</span></div></div>
    <div class="row" style="margin-top:10px">${ok?'':'<button class="btn ghost" id="bMine">제 순서도 맞아요</button>'}<button class="btn" id="bNext">다음 <small>Enter</small></button></div>`;
  X.pend={ok,it,again};if(S.auto)sayNow(it.es);
  $('#bNext').onclick=()=>{xResult(X.pend.ok,it,again);xNext()};const m=$('#bMine');if(m)m.onclick=()=>{xResult(true,it,again);xNext()};$('#bNext').focus({preventScroll:true})}

/* 예문 빈칸 */
function cAsk(){const it=X.q[X.i];X.opts=clozeOpts(it);
  const sent=esc(it.es).replace('___','<span class="blank">　　　</span>');
  $('#view').innerHTML=`<section style="display:flex;flex-direction:column;gap:12px">${xHead()}
    <div class="panel prompt"><div class="ask">빈칸에 알맞은 말은?</div><div class="cz">${sent}</div><div style="color:var(--muted);font-size:15px">${esc(it.ko)}</div>
      ${it.hint?`<div class="vchips"><span class="vchip">${esc(it.hint)}</span></div>`:''}</div>
    <div class="mcq">${X.opts.map((o,i)=>`<button class="mc es" data-i="${i}"><span class="k">${i+1}</span><span>${esc(o)}</span></button>`).join('')}</div><div id="cfb"></div></section>`;
  $('#quitBtn').onclick=quitX;document.querySelectorAll('.mc').forEach(b=>b.onclick=()=>cPick(+b.dataset.i))}
function cPick(i){if(X.done)return;X.done=true;const it=X.q[X.i],ok=X.opts[i]===it.ans,again=X.q.indexOf(it)!==X.i,full=it.es.replace('___',it.ans);
  document.querySelectorAll('.mc').forEach((b,j)=>{b.disabled=true;if(X.opts[j]===it.ans)b.classList.add('right');else if(j===i)b.classList.add('wrong')});
  xResult(ok,it,again);
  const tbl=it.v?`<div class="sec" style="margin-top:8px"><b>${esc(it.v[0])} · ${TBY[it.v[1]].n} 전체</b>${vTableHTML(it.v[0],it.v[1],it.v[2])}</div>`:'';
  $('#cfb').innerHTML=`<div class="fbline ${ok?'good':'bad'}">${ok?'정답':'오답'} · ${esc(full)} ${sayT(full)}</div>${tbl}<button class="btn" id="cNext" style="width:100%;margin-top:8px">다음 <small>Enter</small></button>`;
  $('#cNext').onclick=xNext;$('#cNext').focus({preventScroll:true});if(S.auto)sayNow(full)}

function startD(id){const d=DIALOGS.find(x=>x.id===id);D={d,i:0,mine:0,ok:0,phase:'show',log:[]};$('#tabs').hidden=true;try{history.pushState({camino:'d'},'')}catch(e){}dStep()}
function dBubble(l,hideEs){return l[0]==='A'?`<div class="bub a"><div class="es">${esc(l[1])}</div><div class="ko">${esc(l[2])}</div><div class="aud" style="margin-top:4px">${sayT(l[1])}</div></div>`
  :`<div class="bub b${hideEs?' ask':''}">${hideEs?`<div class="ko">${esc(l[2])}</div><div class="hint">스페인어로 말해 보세요</div>`:`<div class="es">${esc(l[1])}</div><div class="ko">${esc(l[2])}</div><div class="aud" style="margin-top:4px">${sayT(l[1])}</div>`}</div>`}
function dStep(){const {d,i}=D;if(i>=d.lines.length)return dFinish();const l=d.lines[i];
  const shown=d.lines.slice(0,i).map(x=>dBubble(x,false)).join('');

 ['cordoba','and','Mosque–Cathedral_of_Córdoba','Mezquita de Córdoba','Córdoba','코르도바 메스키타','이슬람 사원 안에 성당이 들어선 독특한 건물. 빨강·하양 줄무늬 아치 수백 개가 숲처럼 이어져요.',['¿Puedo entrar con esta mochila?','이 배낭 메고 들어가도 돼요?'],['Hay cientos de arcos rojos y blancos. ¡Me perdí dentro!','빨갛고 하얀 아치가 수백 개야. 안에서 길을 잃었어!'],'n'],

 ['douro','pno','Dom_Luís_I_Bridge','Ponte Dom Luís I','Porto','동 루이스 1세 다리','에펠의 제자가 설계한 2층 철교. 위층은 지하철, 아래층은 차가 다니고, 강가 리베이라 지구 야경이 유명해요.',['Um vinho do Porto, por favor.','포트와인 한 잔 주세요. (포르투갈어)'],['Atravesé el puente a pie. Abajo, el río Duero.','다리를 걸어서 건넜어. 아래로 도우루 강이 흘러.'],'n'],
 ['lello','pno','Livraria_Lello','Livraria Lello','Porto','렐루 서점','세계에서 가장 아름다운 서점으로 꼽혀요. 붉은 곡선 계단이 유명하고, 입장권을 사면 책값에서 빼 줘요.',['Obrigado! (남) / Obrigada! (여)','고마워요! (포르투갈어)'],['La escalera roja es como de un cuento.','빨간 계단이 동화 속 같아.'],'r'],

 ['joanina','pce','Biblioteca_Joanina','Biblioteca Joanina','Coimbra','조아니나 도서관','코임브라 대학의 금빛 바로크 도서관. 밤에 박쥐가 책을 갉아먹는 벌레를 잡아 준다고 해요.',['Fala espanhol?','스페인어 할 줄 아세요? (포르투갈어)'],['En la biblioteca viven murciélagos. ¡Protegen los libros!','도서관에 박쥐가 살아. 책을 지켜 준대!'],'n'],
 ['obidos','pce','Óbidos_Castle','Castelo de Óbidos','Óbidos','오비두스 성','성벽에 둘러싸인 하얀 마을. 왕이 왕비에게 결혼 선물로 준 마을이라 "왕비의 마을"이라 불려요. 체리주 진자를 초콜릿 잔에 마셔요.',['Uma ginjinha, por favor.','진자 한 잔 주세요. (포르투갈어)'],['Bebí licor de cereza en un vaso de chocolate.','초콜릿 잔에 체리주를 마셨어.'],'n'],

 ['belem','lis','Belém_Tower','Torre de Belém','Lisboa','벨렝 탑','대항해 시대 배들이 떠나던 강가의 요새. 바로 근처 가게의 원조 에그타르트(파스테이스 드 벨렝)가 유명해요.',['Um pastel de nata, por favor.','에그타르트 하나 주세요. (포르투갈어)'],['Comí tres pasteles de nata. ¡Todavía calientes!','에그타르트 세 개 먹었어. 아직 따끈해!'],'n'],
 ['jeronimos','lis','Jerónimos_Monastery','Mosteiro dos Jerónimos','Lisboa','제로니무스 수도원','바스쿠 다 가마의 항해를 기념해 지은 수도원. 밧줄과 조개 모양 조각이 바다의 나라답게 새겨져 있어요.',['Quanto custa?','얼마예요? (포르투갈어)'],['Las columnas tienen cuerdas y conchas de piedra.','기둥에 돌로 된 밧줄이랑 조개가 새겨져 있어.'],'n'],
 ['pena','lis','Pena_Palace','Palácio da Pena','Sintra','페나 궁전','안개 낀 산꼭대기의 노랑·빨강 동화 궁전. 신트라 숲 전체가 유네스코 세계유산이에요.',['Que lindo!','정말 예뻐요! (포르투갈어)'],['Parece un castillo de cuento: amarillo, rojo y azul.','동화 속 성 같아. 노랑, 빨강, 파랑이야.'],'r'],
 ['comercio','lis','Praça_do_Comércio','Praça do Comércio','Lisboa','코메르시우 광장','강을 향해 활짝 열린 리스본의 큰 광장. 노란 건물 사이로 노란 트램 28번이 언덕을 오르내려요.',['Um bilhete para o elétrico 28.','28번 트램 표 한 장이요. (포르투갈어)'],['Tomé el tranvía amarillo. ¡Sube y baja muchas cuestas!','노란 트램 탔어. 언덕을 엄청 오르락내리락해!'],'n'],
 ['roca','lis','Cabo_da_Roca','Cabo da Roca','Sintra','호카곶','유럽 대륙의 가장 서쪽 끝. "여기서 땅이 끝나고 바다가 시작된다"는 시 구절이 새겨져 있어요.',['Boa tarde!','안녕하세요 (오후)! (포르투갈어)'],['Estoy en el fin de Europa. Delante, solo el océano.','유럽의 끝에 있어. 앞에는 바다뿐이야.'],'n'],
 ['piedade','alg','Ponta_da_Piedade','Ponta da Piedade','Lagos','폰타 다 피에다드','황금빛 절벽과 바위 아치가 이어진 해안. 작은 보트를 타고 동굴 사이를 지나갈 수 있어요.',['Onde é a praia?','해변이 어디예요? (포르투갈어)'],['Fuimos en barca entre las rocas doradas.','황금빛 바위 사이로 보트를 타고 갔어.'],'n'],
 ['marinha','alg','Praia_da_Marinha','Praia da Marinha','Lagoa','마리냐 해변','세계에서 가장 아름다운 해변 순위에 자주 오르는 곳. 근처 베나길 동굴은 천장에 구멍이 뚫린 바다 동굴이에요.',['Saúde!','건배! (포르투갈어)'],['La playa más bonita que he visto en mi vida.','살면서 본 해변 중에 제일 예뻐.'],'n'],
 ['vicente','alg','Cape_St._Vincent','Cabo de São Vicente','Sagres','상 비센트 곶','유럽 남서쪽 끝, 옛날엔 "세상의 끝"이라 믿었던 곳. 해 질 녘 노을을 보러 사람들이 모여요.',['Tchau! Até logo!','안녕! 또 봐요! (포르투갈어)'],['Vimos la puesta de sol en el fin del mundo.','세상의 끝에서 노을을 봤어.'],'n'],

const PCBY=Object.fromEntries(PC.map(c=>[c.id,c]));
const STAGE_PC={2:'pamplona',3:'burgos',4:'leon',5:'lugo',6:'santiago'};
const RARE=PC.filter(c=>c.tier==='r').map(c=>c.id);
const NORMAL=PC.filter(c=>c.tier==='n').map(c=>c.id);
const ROUTE=[['생장',50,3],['팜플로나',50,13],['부르고스',50,30],['레온',41.6,40],['사리아',33.3,24],['산티아고',25,20]];

/* 기록 */
function PS(){S.pc=S.pc||{own:{},draws:0,stamps:0,seen:{},day:'',streakDay:'',stage:{},dlg:{}};const p=S.pc;['own','seen','stage','dlg'].forEach(k=>p[k]=p[k]||{});p.draws=p.draws||0;p.stamps=p.stamps||0;return p}
const owned=id=>!!PS().own[id];
const ownN=()=>PC.filter(c=>owned(c.id)).length;
function pcGive(id,why){const p=PS();if(p.own[id]){p.stamps++;return {id,dup:true,why}}p.own[id]=day();p.seen[id]=0;return {id,dup:false,why}}
let pcQueue=[];
function pcCheck(){if(typeof PC==='undefined')return;const p=PS(),t=day();
  if(S.todayN>=GOAL&&p.day!==t){p.day=t;p.draws++;pcQueue.push({text:`하루 목표 ${GOAL}개 달성!`,draw:1})}
  const stk=(S.lastDay===t)?S.streak:0;
  if(stk>0&&stk%7===0&&p.streakDay!==t){p.streakDay=t;const left=RARE.filter(id=>!owned(id));const r=pcGive(left.length?left[Math.random()*left.length|0]:NORMAL[Math.random()*NORMAL.length|0],'streak');pcQueue.push({text:`연속 ${stk}일 달성! 희귀 엽서 「${PCBY[r.id].ko}」`,card:r.id,dup:r.dup})}
  for(let n=2;n<=Math.min(6,S.stage||1);n++){if(!p.stage[n]){p.stage[n]=1;const r=pcGive(STAGE_PC[n],'stage');pcQueue.push({text:`${townName(n)} 도착 기념 엽서 「${PCBY[r.id].ko}」`,card:r.id,dup:r.dup})}}}
const __save=save;save=function(){try{pcCheck()}catch(e){}__save();if(pcQueue.length)setTimeout(()=>{try{pcFlush()}catch(e){}},80)};

/* 사진 불러오기: 위키백과 대표 사진 + 위키미디어 공용 출처 정보 */
const IMGKEY='camino-pcimg-v1';let IMGC={};try{IMGC=JSON.parse(localStorage.getItem(IMGKEY)||'{}')}catch(e){}
const imgPending={};
function stripTags(h){const d=document.createElement('div');d.innerHTML=h||'';return (d.textContent||'').trim().replace(/\s+/g,' ')}
async function pcImg(c){if(IMGC[c.id]&&IMGC[c.id].src)return IMGC[c.id];if(imgPending[c.id])return imgPending[c.id];
  imgPending[c.id]=(async()=>{try{const r=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(c.w));if(!r.ok)throw 0;const j=await r.json();
    const orig=j.originalimage&&j.originalimage.source,th=j.thumbnail&&j.thumbnail.source;if(!orig&&!th)throw 0;
    const file=decodeURIComponent((orig||th).split('/').pop().replace(/^\d+px-/,''));
    const big=th?th.replace(/\/\d+px-/,'/960px-'):orig;const info={src:big,alt:th||orig,file,page:j.content_urls&&j.content_urls.desktop&&j.content_urls.desktop.page,artist:'',lic:''};
    try{const m=await fetch('https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&prop=imageinfo&iiprop=extmetadata&titles='+encodeURIComponent('File:'+file));const mj=await m.json();
      const pg=Object.values(mj.query.pages)[0];const em=pg.imageinfo&&pg.imageinfo[0].extmetadata||{};info.artist=stripTags(em.Artist&&em.Artist.value).slice(0,80);info.lic=(em.LicenseShortName&&em.LicenseShortName.value)||''}catch(e){}
    IMGC[c.id]=info;try{localStorage.setItem(IMGKEY,JSON.stringify(IMGC))}catch(e){}return info}catch(e){return null}})();
  return imgPending[c.id]}
function hydrate(root){(root||document).querySelectorAll('[data-pcimg]').forEach(async el=>{const c=PCBY[el.dataset.pcimg];const info=await pcImg(c);if(!info||!el.isConnected)return;
  const img=new Image();img.alt=c.ko;img.loading='lazy';img.onload=()=>{el.style.backgroundImage=`url("${img.src}")`;el.classList.add('loaded')};
  img.onerror=()=>{if(info.alt&&img.src!==info.alt)img.src=info.alt};img.src=info.src;
  const cr=el.closest('.pcard')&&el.closest('.pcard').querySelector('.credit');if(cr)cr.innerHTML=creditHTML(c)})}
function creditHTML(c){const i=IMGC[c.id];if(!i)return '사진: 위키미디어 공용';
  const link=`https://commons.wikimedia.org/wiki/File:${encodeURIComponent(i.file)}`;
  return `사진: ${esc(i.artist||'작가 미상')}${i.lic?' · '+esc(i.lic):''} · <a href="${link}" target="_blank" rel="noopener">위키미디어 공용</a>`}

/* 엽서 그리기 */
function pcFront(c,big){const r=RBY[c.reg];
  return `<div class="pcf${big?' big':''}" data-pcimg="${c.id}" style="--rc:${r.col}">
    <div class="pcf-name"><span class="es">${esc(c.es)}</span><span class="ko">${esc(c.ko)} · ${esc(c.city)}</span></div>
    <div class="pcf-stamp">${r.c==='PT'?'PORTUGAL':'ESPAÑA'}</div>${c.tier==='r'?'<div class="pcf-rare">희귀</div>':c.tier==='s'?'<div class="pcf-rare sp">순례길</div>':''}</div>`}
function pcBack(c){return `<div class="pcb">
  <div class="pcb-story">${esc(c.story)}</div>
  <div class="pcb-ph"><b>여기서 쓸 한마디</b><div class="es">${esc(c.ph[0])}</div><div class="ko">${esc(c.ph[1])}</div>${c.pt?'':sayT(c.ph[0].replace(/\(.+?\)/g,''))}</div>
  <div class="pcb-msg"><b>엽서에 적힌 메시지</b><div class="hand">${esc(c.msg[0])}</div><button class="say mini" data-sayt="${esc(c.msg[0])}">듣기</button> <button class="say mini" data-tr="1">뜻 보기</button><div class="ko tr" hidden>${esc(c.msg[1])}</div></div>
  <div class="credit">사진: 위키미디어 공용</div></div>`}
function pcModal(id,isNew){const c=PCBY[id];PS().seen[id]=1;save();
  let m=document.getElementById('pcModal');if(!m){m=document.createElement('div');m.id='pcModal';m.className='pcmodal';document.body.appendChild(m)}
  m.innerHTML=`<div class="pcm-in" role="dialog" aria-label="${esc(c.ko)} 엽서">
    ${isNew?`<div class="pcm-new">${isNew}</div>`:''}
    <button class="rw-x pcx" aria-label="닫기" onclick="document.getElementById('pcClose').click()">×</button>
    <div class="pcard">${pcFront(c,true)}${pcBack(c)}</div>
    <button class="btn" id="pcClose">닫기</button></div>`;
  m.hidden=false;hydrate(m);m.querySelector('#pcClose').onclick=()=>{m.hidden=true;if(typeof onPcClose==='function'){const f=onPcClose;onPcClose=null;f()}};
  m.onclick=e=>{if(e.target===m)m.querySelector('#pcClose').click();const t=e.target.closest('[data-tr]');if(t){const k=m.querySelector('.tr');k.hidden=!k.hidden}}}
let onPcClose=null;
function pcDraw(){const p=PS();if(p.draws<1)return;p.draws--;
  const r=pcGive(NORMAL[Math.random()*NORMAL.length|0],'draw');save();sfx.stamp();
  pcModal(r.id,r.dup?'이미 있는 엽서예요 · 우표 +1':'새 엽서!');onPcClose=()=>book()}
function pcTrade(id){const p=PS(),cost=PCBY[id].tier==='r'?10:5;if(p.stamps<cost||owned(id))return;p.stamps-=cost;pcGive(id,'trade');save();pcModal(id,'우표로 교환했어요');onPcClose=()=>book()}

/* 도감 탭 */
let bookTab='pc',bookReg=null;
function book(){const p=PS(),n=ownN();
  $('#view').innerHTML=`<div style="display:flex;flex-direction:column;gap:12px">
    <div class="chips"><button class="chip" data-bt="pc" aria-pressed="${bookTab==='pc'}">엽서 <span class="num">${n}/${PC.length}</span></button><button class="chip" data-bt="map" aria-pressed="${bookTab==='map'}">지도</button><button class="chip" data-bt="sello" aria-pressed="${bookTab==='sello'}">세요 도장</button></div>
    <div id="bookBody"></div></div>`;

    return o?`<g class="pin" data-pc="${c.id}" transform="translate(${x},${y}) scale(1.5)"><rect x="-7" y="-5" width="14" height="10" rx="1.5" fill="#fff" stroke="${INK}" stroke-width=".8"/><rect x="-5.5" y="-3.5" width="7" height="7" fill="${col}"/><rect x="2.8" y="-3.5" width="2.5" height="2.5" fill="${c.tier==='r'?'#C9A227':'#C4513B'}"/></g>`
      :`<circle cx="${x}" cy="${y}" r="4.5" class="pin0"/>`}).join('');
  const stopsSVG=stops.map(([nm,[x,y]],i)=>{const done=i<=curIdx;
    return `<g transform="translate(${x},${y})"><circle r="${i===curIdx?7:5}" fill="${done?'#C9902A':'#FBF4E2'}" stroke="${INK}" stroke-width="1.4"/>${i===5?`<path d="M-5,-9 l5,-9 l5,9 M-3,-9 v-4 M3,-9 v-4" stroke="${INK}" stroke-width="1.3" fill="none"/>`:''}</g>`}).join('');
  const [cx,cy]=curStop[1];
  const youAre=`<g transform="translate(${cx},${cy})"><path d="M0,-10 C-9,-24 -18,-30 -18,-40 a18,18 0 0 1 36,0 C18,-30 9,-24 0,-10Z" fill="#C4513B" stroke="#FBF4E2" stroke-width="2"/><g transform="translate(0,-41) scale(.62)">${'<path d="M0 -12 C-9 -12 -14 -5 -14 1 L0 14 L14 1 C14 -5 9 -12 0 -12Z" fill="#F2B705"/><path d="M0 -10v22M-5 -8 -2 12M5 -8 2 12" stroke="#7A4A10" stroke-width="1.4"/>'}</g>
     <g transform="translate(14,40)"><rect x="-92" y="-20" width="184" height="40" rx="9" fill="#FBF4E2" stroke="${INK}" stroke-width="1.6"/><text y="8" text-anchor="middle" class="mtag">현재 단계: ${curStop[0]}</text></g></g>`;
  return `<div class="vmap"><svg viewBox="40 30 940 760" role="img" aria-label="스페인·포르투갈 엽서 지도">
    <defs>
      <filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="4"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .33  0 0 0 0 .18  0 0 0 .09 0"/></filter>
      <filter id="blot" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="2" seed="9"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .42  0 0 0 0 .25  0 0 0 .22 0"/></filter>
      <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="7" stroke="#B49A6A" stroke-width="1" opacity=".35"/></pattern>
      <pattern id="waves" width="46" height="22" patternUnits="userSpaceOnUse"><path d="M3 12 q5 -6 10 0 t10 0" fill="none" stroke="#6E9B9C" stroke-width="1.1" opacity=".35"/></pattern>
      <filter id="lshadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#3B2A14" flood-opacity=".28"/></filter>
    </defs>
    <rect x="0" y="0" width="1000" height="820" fill="#BCD4CF"/>
    <rect x="0" y="0" width="1000" height="820" fill="url(#waves)"/>
    <path d="${M.neighbors}" fill="${NB_BASE}" stroke="#A88E62" stroke-width="1"/>
    <g filter="url(#lshadow)">${regs}</g>
    <path d="${routeD}" fill="none" stroke="#FBF4E2" stroke-width="6" stroke-linecap="round"/>
    <path d="${routeD}" fill="none" stroke="${INK}" stroke-width="2.2" stroke-dasharray="7 6" stroke-linecap="round"/>
    ${cur>1?`<path d="${walked}" fill="none" stroke="#C9902A" stroke-width="4" stroke-linecap="round"/>`:''}
    ${pins}${stopsSVG}${labels}
    <text x="${M.seas.atl[0]+38}" y="${M.seas.atl[1]+60}" class="msea" transform="rotate(-78 ${M.seas.atl[0]+38} ${M.seas.atl[1]+60})">Océano Atlántico</text>
    <text x="${M.seas.cant[0]}" y="${M.seas.cant[1]}" class="msea">Mar Cantábrico</text>
    <text x="${M.seas.med[0]}" y="${M.seas.med[1]}" class="msea">Mar Mediterráneo</text>
    <text x="${M.countries.ES[0]+40}" y="${M.countries.ES[1]+110}" class="mcountry">ESPAÑA</text>
    <text x="${M.countries.PT[0]-40}" y="${M.countries.PT[1]+30}" class="mcountry pt" transform="rotate(-80 ${M.countries.PT[0]-40} ${M.countries.PT[1]+30})">PORTUGAL</text>
    <text x="${M.countries.FR[0]}" y="${M.countries.FR[1]}" class="mcountry fr">FRANCIA</text>
    ${compassSVG(92,752,32)}
    ${youAre}
    <rect x="0" y="0" width="1000" height="820" filter="url(#blot)" pointer-events="none"/>
    <rect x="0" y="0" width="1000" height="820" filter="url(#paper)" pointer-events="none"/>
  </svg></div>`}
function regionSheetHTML(g){if(!g)return `<div class="rsheet empty">지도에서 지역을 눌러 그 지역 엽서를 확인해 보세요.</div>`;
  const r=RBY[g],cs=PC.filter(c=>c.reg===g),got=cs.filter(c=>owned(c.id)).length;
  return `<div class="rsheet"><div class="route-row"><div class="rs-t"><span class="rdot" style="background:${r.col}"></span>${r.n} 엽서 <span class="num">${got}/${cs.length}</span></div>${got===cs.length?'<span class="donebadge">수집 완료</span>':''}</div>
    <div class="rs-strip">${cs.map(c=>owned(c.id)?`<button class="mpcw" data-open="${c.id}">${mpcHTML(c)}<span>${esc(c.ko)}</span></button>`
      :`<div class="mpcw off">${mpcHTML(c,true)}<span>${esc(c.ko)}</span></div>`).join('')}</div></div>`}
function mpcHTML(c,locked){const r=RBY[c.reg];
  return `<div class="mpc${c.tier==='r'?' rare':''}${locked?' locked':''}"><div class="mpc-ph" ${locked?'':`data-pcimg="${c.id}"`} style="--rc:${r.col}">${locked?'<span class="q">?</span>':''}</div>
    <div class="mpc-r"><div class="mpc-st" style="--rc:${r.col}">${SHELL}</div><i></i><i></i><i></i></div>${c.tier==='r'?'<b class="mpc-tag">희귀</b>':''}</div>`}
function missionsHTML(){const p=PS(),t=day(),stk=(S.lastDay===t||S.lastDay===yday())?S.streak:0,cur=S.stage||1;
  const dlgDone=DIALOGS.filter(d=>p.dlg[d.id]).length,pr=cur<=5?stageProg(cur):null;
  const ms=[
    [p.day===t,`하루 목표 ${GOAL}개 채우기`,`${Math.min(S.todayN,GOAL)}/${GOAL}`,'엽서 뽑기 1회'],
    [false,`연속 ${Math.ceil(Math.max(stk,1)/7)*7}일 공부하기`,`${stk}일째`,'희귀 엽서'],
    [cur>5,cur<=5?`${townName(cur+1)} 도착하기 (관문 시험)`:'산티아고 완주',pr?`${pr.done}/${pr.need}`:'완료','도착 기념 엽서'],
    [dlgDone===DIALOGS.length,'상황 대화 80% 이상 완료',`${dlgDone}/${DIALOGS.length}`,'대화마다 뽑기 1회'],
  ];
  return `<section class="panel missions"><div class="label">진행 중인 미션</div>${ms.map(([ok,t1,prog,rw])=>`<div class="ms${ok?' ok':''}"><span class="mchk">${ok?'✓':''}</span><div class="mt"><div>${t1}</div><small>보상: ${rw}</small></div><span class="mp num">${prog}</span></div>`).join('')}</section>`}

/* 미션 클리어 팝업 */
const busy=()=>!!(R||V||X||TT||D);
function pcFlush(){if(!pcQueue.length||busy())return;const list=pcQueue.splice(0);rewardModal(list)}
function rewardModal(list){const cards=list.filter(o=>o.card).map(o=>o),draws=list.reduce((a,o)=>a+(o.draw||0),0);
  let m=document.getElementById('rwModal');if(!m){m=document.createElement('div');m.id='rwModal';m.className='rwmodal';document.body.appendChild(m)}
  const conf=Array.from({length:26},(_,i)=>`<i style="--x:${(Math.random()*100).toFixed(0)}%;--d:${(Math.random()*.8).toFixed(2)}s;--r:${(Math.random()*360)|0}deg;--c:${['#F2B705','#C4513B','#1F4E9A','#2E7D4F','#E08A1E'][i%5]}"></i>`).join('');
  m.innerHTML=`<div class="rw-in" role="dialog" aria-label="미션 클리어"><div class="confetti" aria-hidden="true">${conf}</div>
    <div class="rw-badge">${badgeSVG()}</div>
    <button class="rw-x" id="rwX" aria-label="닫기">×</button>
    <h2>축하합니다! 미션 클리어</h2><div class="rw-body">
    ${cards.length?`<div class="rw-cards">${cards.map(o=>`<div class="rw-c">${mpcHTML(PCBY[o.card])}<span>${esc(PCBY[o.card].ko)}${o.dup?' <small>(중복 · 우표 +1)</small>':''}</span></div>`).join('')}</div>`:''}
    ${draws?`<div class="rw-ticket"><span class="tk">${SHELL}</span>엽서 뽑기권 ${draws}회</div>`:''}
    <ul class="rw-list">${list.map(o=>`<li>${esc(o.text)}<span>✓</span></li>`).join('')}</ul></div>
    <div class="row rw-btns">${PS().draws?'<button class="btn ghost" id="rwDraw">뽑으러 가기</button>':''}<button class="btn" id="rwOk">확인</button></div></div>`;
  m.hidden=false;sfx.stamp();hydrate(m);
  m.querySelector('#rwOk').onclick=()=>{m.hidden=true};m.querySelector('#rwX').onclick=()=>{m.hidden=true};m.onclick=e=>{if(e.target===m)m.hidden=true};const d=m.querySelector('#rwDraw');if(d)d.onclick=()=>{m.hidden=true;bookTab='pc';setTab('passport')}}
function badgeSVG(){return `<svg viewBox="0 0 160 150" aria-hidden="true"><defs><linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCE38A"/><stop offset=".5" stop-color="#E2B33C"/><stop offset="1" stop-color="#B07D00"/></linearGradient></defs>
  <path d="M28 92 L8 112 L30 112 L36 132 L56 104Z M132 92 L152 112 L130 112 L124 132 L104 104Z" fill="#1F4E9A"/>
  <g transform="translate(80,66)">${Array.from({length:16},(_,i)=>{const a=i*Math.PI/8;return `<circle cx="${Math.cos(a)*50}" cy="${Math.sin(a)*50}" r="13" fill="url(#gold)"/>`}).join('')}<circle r="52" fill="url(#gold)"/><circle r="43" fill="#1F4E9A" stroke="#FCE38A" stroke-width="3"/>
  <g transform="translate(0,-18) scale(.9)"><path d="M0 -12 C-9 -12 -14 -5 -14 1 L0 14 L14 1 C14 -5 9 -12 0 -12Z" fill="#F2B705"/><path d="M0 -10v22M-5 -8 -2 12M5 -8 2 12" stroke="#7A4A10" stroke-width="1.4"/></g>
  <text y="10" text-anchor="middle" font-size="15" fill="#FCE38A" font-family="Jua,sans-serif">Mission</text><text y="28" text-anchor="middle" font-size="15" fill="#FCE38A" font-family="Jua,sans-serif">Cleared</text></g>
  <path d="M22 104 Q80 124 138 104 L134 124 Q80 142 26 124Z" fill="#2B5DAF" stroke="#173C78"/><text x="80" y="126" text-anchor="middle" font-size="12" fill="#fff" font-family="Jua,sans-serif">¡ENHORABUENA!</text></svg>`}

/* ---------- 키보드 ---------- */
document.addEventListener('keydown',e=>{if(!R||e.repeat||e.target.matches?.('textarea,input'))return;
  if(R.phase==='ask'){if(e.key==='ArrowLeft'||e.key==='1'){e.preventDefault();reveal(false)}else if(e.key==='ArrowRight'||e.key==='2'){e.preventDefault();reveal(true)}else if(e.key==='3'){e.preventDefault();reveal(true,true)}}
  else if(R.phase==='reveal'){if(e.key==='Enter'||e.key===' '){e.preventDefault();commit(R.knew,R.sure)}else if((e.key==='x'||e.key==='X')&&R.knew){commit(false)}else if(e.key==='3'&&R.knew){commit(true,true)}}
  else if(R.phase==='stamp'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();advance()}});
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
const mb=$('#muteBtn'),ab=$('#autoBtn');
const paint=()=>{const set=(b,on)=>{b.setAttribute('aria-checked',String(on));b.querySelector('.st').textContent=on?'ON':'OFF';b.title=on?'켜져 있어요 · 누르면 꺼져요':'꺼져 있어요 · 누르면 켜져요'};
  set(mb,!S.mute);set(ab,S.auto);ab.hidden=!canSpeak};
mb.onclick=()=>{S.mute=!S.mute;save();paint();if(!S.mute)tone(660,.1,'triangle')};
ab.onclick=()=>{S.auto=!S.auto;save();paint()};paint();
home();
</script>

</html>
